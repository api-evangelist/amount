name: Amount
description: 'Amount is a Chicago-based financial technology company that provides banks, credit unions,
  and fintechs with a digital lending and account-origination platform. Spun out of the consumer lender
  Avant in 2020 and backed by QED Investors, Amount delivers configurable software for personal loans,
  point-of-sale and buy-now-pay-later financing, deposit and account opening, and integrated fraud,
  identity verification, and decisioning. Its product API is delivered to enterprise banking customers
  through a private, credentialed developer portal (docs.amount.com) rather than a public self-serve API.'
